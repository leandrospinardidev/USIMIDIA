name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_industrial
        options: >-
          --health-cmd "pg_isready -U erp -d erp_industrial"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_industrial

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"

      - name: Lint
        run: ruff check apps/api/src

      - name: Migration check
        run: alembic -c db/migrations/alembic.ini upgrade head

      - name: Run tests
        run: pytest apps/api/src/tests -q
