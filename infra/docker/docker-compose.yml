services:
  db:
    image: postgres:16-alpine
    container_name: erp-industrial-db
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_industrial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_industrial"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: erp-industrial-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/erp_industrial
      ENVIRONMENT: development
      DEBUG: "true"
      API_PREFIX: /api/v1
    ports:
      - "8000:8000"

volumes:
  pgdata:
